<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Dartic</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icon-32.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      document.documentElement.classList.remove("no-js");
      try {
        const t = localStorage.getItem("dartic-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
      .not-found h1 { font-size: clamp(64px, 14vw, 120px); line-height: 1; margin-bottom: 12px; }
      .not-found p { color: var(--muted); margin: 0 auto 28px; max-width: 420px; }
      .not-found code { font-family: var(--mono); }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div>
        <img src="/assets/img/icon-180.png" alt="" width="72" height="72" style="border-radius: 20px; margin: 0 auto 20px" />
        <h1 class="gradient-text">404</h1>
        <p><code>NoSuchMethodError</code>: this page doesn't exist. It may have moved, or the link is mistyped.</p>
        <a class="btn btn-primary" href="/">Back to Dartic</a>
      </div>
    </main>
  </body>
</html>
