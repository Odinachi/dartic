<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Dartic</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      document.documentElement.classList.add("js");
      try {
        const t = localStorage.getItem("dartic-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
      .not-found h1 { font-size: clamp(72px, 16vw, 160px); line-height: 0.9; letter-spacing: -0.06em; margin-bottom: 18px; }
      .not-found h1 em { font-style: normal; color: var(--accent); }
      .not-found p { color: var(--muted); margin: 0 auto 28px; max-width: 420px; }
      .not-found code { font-family: var(--mono); }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div>
        <img src="/assets/img/icon-192.png" alt="" width="72" height="72" style="border-radius: 16px; margin: 0 auto 28px; width: 56px; height: 56px" />
        <h1>4<em>0</em>4</h1>
        <p><code>NoSuchMethodError</code>: this page doesn't exist. It may have moved, or the link is mistyped.</p>
        <a class="btn btn-ink" href="/">Back to Dartic</a>
      </div>
    </main>
  </body>
</html>
